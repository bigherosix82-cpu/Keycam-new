<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KeyCam — Mouse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../deskmat/styles.css">
<link rel="stylesheet" href="../shared/catalog.css">
</head>
<body>

<div id="siteHeader"></div>

<main class="listing">
  <div class="container">
    <div class="breadcrumbs"><a href="../index.html">Home</a><span>›</span><span>Mouse</span></div>
    <div class="listing-head">
      <div>
        <p class="eyebrow">KEYCAM MOUSE</p>
        <h1>Mouse</h1>
        <p style="color:var(--muted);">Mice — colors and connection types.</p>
      </div>
    </div>
    <div class="listing-grid" id="listingGrid"><div class="catalog-loading">Loading…</div></div>
  </div>
</main>

<div id="siteFooter"></div>
<div id="siteOverlays"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-client.js"></script>
<script src="../shared/catalog-client.js"></script>
<script src="../shared/catalog-cart.js"></script>
<script src="../shared/layout.js"></script>
<script>
initLayout({ base: "../", active: "mouse" });

window.CATALOG_READY.then(() => {
  const products = window.CATALOG.products.filter(p => p.category === "mouse");
  const grid = document.querySelector("#listingGrid");

  if(!products.length){
    grid.innerHTML = `<p style="color:var(--muted);grid-column:1/-1;">No products here yet.</p>`;
    return;
  }

  grid.innerHTML = products.map(p => `
    <a class="product-card" href="product.html?id=${p.id}">
      <div class="product-art">
        ${catalogDiscountBadgeHTML(p)}
        ${p.thumbnail ? `<img src="${p.thumbnail}" alt="${p.name}" loading="lazy" style="width:100%;height:100%;object-fit:cover;">` : ""}
      </div>
      <div style="padding:14px;">
        <strong style="display:block;font:600 14px 'Space Grotesk';">${p.name}</strong>
        <span style="color:var(--muted);font-size:12px;text-transform:capitalize;">${p.subtype || ""}</span>
        <div style="margin-top:8px;font:700 15px 'Space Grotesk';color:var(--blue);">${catalogPriceRangeHTML(p)}</div>
      </div>
    </a>
  `).join("");
});
</script>
</body>
</html>
